[TraversalChanger.X2Item_TraversalChanger]

;! Please note that the items may lack localisation, in which case it should be added to XComGame.int

;* ===============================
;* ITEMS & VESTS
;* ===============================

;+TraversalItems=(
;    Enabled=true, \\
;    TemplateName="ItemTemplateName", \\
;    ImagePath="UILibrary_StrategyImages.X2InventoryIcons.Inv_Microservo_Module", \\
;    AbilityName="PrimaryAbilityName", \\
;    AbilityNames=("SecondaryAbility", \\ "TertiaryAbility"), \\
;    CanBeBuilt=true, \\
;    StartingItem=false, \\
;    InfiniteItem=false, \\
;    TradeValue=25, \\
;    Cost=35, \\
;    Tier=0 \\
;)

;? -----------------------------------
;? ITEMS DECOMPOSITION
;? -----------------------------------

;Enabled=true
;* Set to false to disable this item without removing it from config

;TemplateName="ItemTemplateName"
;* The internal name of the item (no spaces, this is what gets referenced in code)

;ImagePath="UILibrary_StrategyImages.X2InventoryIcons.Inv_Microservo_Module"
;* Path to the item icon image

;AbilityName="PrimaryAbilityName"
;* The primary traversal ability this item grants (e.g., "WallBreaker")

;AbilityNames=("SecondaryAbility", "TertiaryAbility")
;* Additional secondary abilities the item provides (optional bonuses)

;CanBeBuilt=true
;* Whether this item can be built in the proving grounds

;StartingItem=false
;* Whether soldiers start with this item at game launch

;InfiniteItem=false
;* If true, the item is not consumed and cost/trading values do not apply

;TradeValue=25
;* How many supplies you get from selling this item

;Cost=35
;* Construction cost in supplies

;Tier=0
;* Used for sorting, higher means it shows up higher in the loadout UI

;* ===============================
;* VESTS
;* ===============================

;+TraversalVests=(
;    Enabled=true, \\
;    TemplateName="VestTemplateName", \\
;    ImagePath="UILibrary_StrategyImages.X2InventoryIcons.Inv_Tarantula_Suit", \\
;    AbilityName="PrimaryAbilityName", \\
;    AbilityNames=("SecondaryAbility"), \\
;    CanBeBuilt=true, \\
;    StartingItem=false, \\
;    InfiniteItem=false, \\
;    TradeValue=45, \\
;    Cost=60, \\
;    Tier=2, \\
;    Bonuses=(\\
;          (BonusStatType=eStat_HP, \\
;                  BonusValue=1), \\
;    (BonusStatType=eStat_Mobility, \\
;                  BonusValue=1)), \\
;    AddExperimentalArmorRewards=true \\
;)

;? -----------------------------------
;? VESTS DECOMPOSITION
;? -----------------------------------

;* Most fields are the same as items. Additional vest-specific fields:

;Bonuses=((BonusStatType=eStat_HP,BonusValue=1),(BonusStatType=eStat_Mobility,BonusValue=1))
;* Stat bonuses provided by wearing this vest
;* Format: ( (StatType,Value), (StatType,Value), ...)
;* Supported stats: eStat_HP, eStat_Offense, eStat_Will, eStat_Mobility, eStat_Hacking,
;*                  eStat_ArmorMitigation, eStat_Dodge, eStat_Defense, eStat_PsiOffense

;AddExperimentalArmorRewards=true
;* Whether this vest can be found in experimental armor reward decks

