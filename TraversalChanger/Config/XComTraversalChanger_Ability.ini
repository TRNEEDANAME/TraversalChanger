;     Change="eTraversal_BreakWall", \\
;     RemoveTraversal = false, \\
;     Description="Passive traversal description."
;   )

;? -----------------------------------
;? PASSIVE ABILITY DECOMPOSITION
;? -----------------------------------

;+PassiveAbilities=(
;* Create a new passive ability

;AbilityTemplateName="AbilityTemplateName"
;* The internal name, it cannot have spaces, this is what you'll add to the units / items

;AbilityName="Ability Name"
;* The name you see in game, can contain spaces

;IconPath="UILibrary_PerkIcons.UIPerk_absorption_fields"
;* The ability Icon

;EffectName="EffectName"
;* The effect that will be given, can be anything

;Change="eTraversal_BreakWall"
;* The traversal change, below is a list of all traversal changes, note that some don't work / do anything without proper support

;eTraversal_Normal --- Do not chance, really, it will break the unit
;eTraversal_ClimbOver --- Climb over objects (windows and such)
;eTraversal_ClimbOnto --- Climb onto an object (untested)
;eTraversal_ClimbLadder --- Climb ladders, water pipes...
;eTraversal_DropDown ---  Drop down any height
;eTraversal_Grapple --- Not tested, doesn't seem to do anything
;eTraversal_Landing --- Used by the archon (?) but unused
;eTraversal_BreakWindow --- Break windows, pretty self explanatory
;eTraversal_KickDoor ---  Kick doors, pretty self explanatory
;eTraversal_WallClimb --- Climb walls
;eTraversal_JumpUp --- Jump up walls
;eTraversal_Ramp --- Do not chance, really, it will break the unit
;eTraversal_BreakWall --- Break walls
;eTraversal_Phasing --- Phase through walls
;eTraversal_Launch --- Used by the archon (?) but unused
;eTraversal_Flying --- Used by the archon (?) but unused
;eTraversal_Land --- Used by the archon (?) but unused
;eTraversal_Teleport --- Not tested, doesn't seem to do anything
;eTraversal_Unreachable --- Not tested, doesn't seem to do anything
;eTraversal_None --- Not tested, doesn't seem to do anything

;RemoveTraversal = false
;* Does the ability remove a traversal rule, instead of adding one.

;Description="Passive traversal description."
;* The ability's description

