;? -----------------------------------
;? ACTIVE ABILITY DECOMPOSITION
;? -----------------------------------

;+ActiveAbilities=(
;* Create a new active ability

;AbilityTemplateName="AbilityTemplateName"
;* The internal name, it cannot have spaces, this is what you'll add to the units / items

;AbilityName="Ability Name"
;* The name you see in game, can contain spaces

;IconPath="UILibrary_PerkIcons.UIPerk_absorption_fields"
;* The ability Icon

;EffectName="EffectName"
;* The effect that will be given, can be anything

;Change="eTraversal_Phasing"
;* The traversal change

;Description="Passive traversal description."
;* The ability's description

;NumTurns=2
;* The amount of turns that the ability is active for

;AP_Cost=1
;* The action point cost

;IsFree=false
;* Is the ability free to use (no AP cost)

;ConsumeAllPoints=false
;* Does the ability consume all remaining AP (ie. always end the turn)

;Cooldown=2
;* The ability cooldown

;HasCharge=true
;* Does the ability have charges, if false, the values related to charge won't apply

;InitialCharge=2
;* Amount of charges available

;!!! ============================================ DEFAULT VALUES ==================================================

;* By default, if the values are ommited, it will use those :

; IconPath = "UILibrary_PerkIcons.UIPerk_absorption_fields"
; NumTurns = 2
; AP_Cost = 1
; IsFree = false
; ConsumeAllPoints = false
; Cooldown = 1
; HasCharge = false
; InitialCharge = 2

