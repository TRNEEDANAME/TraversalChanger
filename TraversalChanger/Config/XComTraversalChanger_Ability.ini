;* Hello !
;* This is the main config file for my "Traversal changer" mod, as the mod is very heavily config driven, it can be hard to parse for people not familiar with Xcom's config files
;* I tried to make it easy to use, but don't be afraid to ask for help in the "Config help" Discussion
;* This mod has 3 distinct part :

;* - Ability creation : creates all of the Traversal changing abilities (include passive, active and removal abilities)
;* - Item / Vest creation : optionally, create vests & items that can have those abilities
;* - Applying abilities : To who the new abilities are created, can be a unit (AdvCaptainM1), a group of unit (viper), an item / vest or a class.

;! IMPORTANT : Using "\\" is possible, but you NEED to make sure that there are no space or any other character after.
;! The Xcom config parser removes the "\\" and put them in a single line, so the config is really :
; +PassiveAbilities=(AbilityTemplateName="AbilityTemplateName"AbilityName="Ability Name",EffectName="EffectName",Change=eTraversal_BreakWall,Description="Passive traversal description.")

;! If you leave spaces after, the ability WILL break
;* Use https://robojumper.github.io/ue3-config-parser/index.html if you want to check

[TraversalChanger.X2Ability_TraversalChanger]

;* ===============================
;* PASSIVE ABILITIES
;* ===============================

;! These abilities are always active

; +PassiveAbilities=( \\
