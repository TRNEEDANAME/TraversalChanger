[TraversalChanger.X2DLCInfo_TraversalChanger]

;* ===============================
;* CHARACTER GROUPS & CLASSES
;* ===============================

;* You can assign traversal abilities to specific units, armours, items, vests, character groups or classes.
;* Specific units are for example, AdvTrooperM3


;+TraversalChanger_Classes = (ClassName="ranger", AbilityName="WallPhaser", Rank=0)
;* Assigns an ability to a soldier class at a specific rank.
;* ClassName: ranger, specialist, heavy, psi_operative, etc.
;* Rank: The rank at which the soldier gains this ability (0=squaddie, 7=colonel)
;* The ability is added to the class's ability pool at that rank if not already present.
;* If giving them to hero units, the AP cost won't be added, this will need to be manually added to XComPromotionUIMod.ini

;+TraversalChanger_Item(ItemName = "BattleScanner", AbilityName="WallPhaser")
;* Gives the ability to an item

;+TraversalChanger_Armour(ArmourName = "BattleScanner", AbilityName="WallPhaser")
;* Gives the ability to an armour

;+TraversalChanger_CharacterGroup = (CharacterGroupName="ChosenWarlock", AbilityName="WallBreaker_Passive_Warlock")
;* Assigns an ability to all units in a character group.
;* Character groups are sets of units (e.g., all Chosen, all Mutons).

;+TraversalChanger_Character = (CharacterName="AdvCaptainM1", AbilityName="WallBreaker_Passive")
;* Assigns an ability to a specific individual character by their Character Name.

;? ===============================
;? HOW ASSIGNMENTS WORK
;? ===============================

;* The mod uses a patching system that runs after templates are created.
;* It iterates through the config assignments and adds traversal abilities to:
;*   1. Items/Vests: Abilities added directly to the equipment template
;*   2. Character Groups: Abilities added to all units in the group
;*   3. Individual Characters: Abilities added to specific unit templates
;*   4. Soldier Classes: Abilities added to class ability pools at specified ranks

;* Passive abilities are typically recommended for AI units (enemies, aliens) since they
;* automatically gain the traversal. Active abilities work best for player soldiers as the player controls them
;* Using active abilities for AI units is possible, but requires AI edits

